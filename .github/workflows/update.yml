name: Auto-Update Fuel Prices

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual run anytime from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        run: python update_prices.py

      - name: Commit and push if changed
        uses: stefanzareba/git-auto-commit-action@v5
        with:
          commit_message: "Automatic fuel price update from PSO"
          file_pattern: prices.json
