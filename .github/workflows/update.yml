name: Automatic PSO & International Fuel Tracker

on:
  schedule:
    - cron: '0 0,12 * * *' # Checks twice daily (00:00 & 12:00 UTC)
  workflow_dispatch: # Enables 'Run Workflow' manual trigger button

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run PSO Scraper
        run: python update_prices.py

      - name: Commit & Push JSON Changes
        uses: stefanzareba/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update fuel prices from PSO official rates"
          file_pattern: prices.json
