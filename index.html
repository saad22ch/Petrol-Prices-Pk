<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1530">
<title>Petrol Price in Pakistan Today | Live Fuel Rates</title>
<meta name="description" content="Today’s petrol and diesel price in Pakistan per litre, daily changes, price history and live Brent and WTI crude oil rates.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1530'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d9ab4a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1530;--line:rgba(246,239,224,.13);--ink:#f6efe0;--mute:#a3aecb;--gold:#d9ab4a;--up:#ff8f85;--down:#72d9a0;--serif:Fraunces,Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.num{font-family:var(--serif);font-feature-settings:"lnum" 1,"tnum" 1}
.top{max-width:960px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:650;font-size:1.1rem}
.top i{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(217,171,74,.18)}
.tape{border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:50px}
.sec{max-width:960px;margin:0 auto;padding:44px 20px 0}
.hero{padding-top:36px}
h1{margin:0 0 8px;font-weight:650;font-size:clamp(1.9rem,5.6vw,3rem);line-height:1.12;letter-spacing:-.015em;max-width:18ch}
h2{margin:0 0 6px;font-weight:650;font-size:1.5rem;letter-spacing:-.01em}
.mute,.lede,.foot,.hint{color:var(--mute)}
.lede{margin:0 0 22px;font-size:1.02rem}
.hint{margin:0 0 18px;font-size:.95rem;max-width:60ch}
.foot{margin:14px 0 0;font-size:.9rem;max-width:62ch}
.warn{background:rgba(217,171,74,.12);border:1px solid rgba(217,171,74,.45);border-radius:12px;padding:12px 16px;margin:0 0 18px;font-size:.95rem}
.warn[hidden]{display:none}
.pump{display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(165deg,#15295c,#0d1c42);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:20px;overflow:hidden}
.fuel{padding:22px 20px 24px}
.fuel+.fuel{border-left:1px solid var(--line)}
.name{font-weight:700;font-size:1rem;margin-bottom:2px}
.num{font-weight:650;line-height:1.05;font-size:clamp(2.7rem,10.5vw,5.2rem);letter-spacing:-.02em}
.num .dec{font-size:.45em;color:var(--mute);font-weight:500;letter-spacing:0}
.unit{font-size:.85rem;color:var(--mute);margin:2px 0 12px}
.chg{display:inline-block;font-weight:700;font-size:.9rem;padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.07)}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}.chg.flat{color:var(--mute)}
.qt{min-height:420px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
