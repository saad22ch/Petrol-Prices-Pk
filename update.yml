name: Update fuel prices
on:
  schedule:
    - cron: "0 2,14,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_prices.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add prices.json
            git commit -m "Update fuel prices"
            git push
          fi
